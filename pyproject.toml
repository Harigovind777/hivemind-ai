[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.1.0"
description = "HiveMind AI: specialist LLM agents that resolve disagreements with checkable evidence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
