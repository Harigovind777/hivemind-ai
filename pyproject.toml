[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind"
version = "0.1.0"
description = "HiveMind AI: specialist LLM agents that resolve disagreements with checkable evidence"
readme = "README.md"
# 3.11 is the real floor: runner.py and report.py import tomllib, which is 3.11+.
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["hivemind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
