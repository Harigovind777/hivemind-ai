# Headline experiment on Claude. Needs ANTHROPIC_API_KEY (or an `ant auth login` profile).
# Start with --tasks 10 to measure real cost per task before running all 164.

[run]
name = "main-claude-opus-5-5"
benchmark = "humaneval"
n_tasks = 164
sample_seed = 0
seed = 0
candidates = 3
debate_rounds = 1
repair = true
workers = 4

[agents]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"     # Opus 5.5 always thinks; effort sets how much
max_tokens = 16000

[coordinator]
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 16000
